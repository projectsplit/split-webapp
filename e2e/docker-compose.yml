name: split-webapp-e2e

services:
  e2e:
    build: .
    image: split-webapp-e2e:1.63.0
    working_dir: /app/e2e
    command: ["npx", "playwright", "test", "--ui-host=0.0.0.0", "--ui-port=9323"]
    init: true
    ipc: host
    environment:
      CI: ${CI:-}
      UPDATE_RENDER_BASELINES: ${UPDATE_RENDER_BASELINES:-}
    volumes:
      - ..:/app
      - app-node-modules:/app/node_modules
      - /app/e2e/node_modules
    ports:
      - "127.0.0.1:9323:9323"

volumes:
  app-node-modules:
